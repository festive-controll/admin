<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Topic Registration</title>
    <!-- Favicon / PWA Setup -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="logo-512.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="logo-192.png">
</head>

<body>
    <div class="mb-6 shrink-0 pt-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <h1 id="tmt-title" class="text-xl sm:text-[22px] font-semibold text-gray-900 leading-tight">Topic
                Registration</h1>
            <p class="text-[13px] text-gray-500 mt-1">Submit topics for programs based on participant/set count.</p>
        </div>
    </div>

    <!-- Status Banner Container -->
    <div id="tmt-status-banner"></div>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 pb-6" id="tmt-list">
        <div class="col-span-full py-16 text-center text-[13px] text-gray-400">
            <div class="w-6 h-6 border-2 border-gray-200 border-t-brand-blue rounded-full animate-spin mx-auto mb-3">
            </div>
            Fetching topics...
        </div>
    </div>

    <script>
        document.getElementById('tmt-title').innerText = (window.currentTMSection || 'Section') + ' Topic Registration';
        var section = window.currentTMSection;
        var team = localStorage.getItem('managerTeam');

        window.tmtProgramsList = [];
        window.tmtRegistrationsList = [];
        window.tmtCandidates = [];
        window.tmtActiveTabs = {};
        window.tmtConfig = null;

        function checkTopicWindowUnlocked(config) {
            if (!config) return false;
            const { start, end } = config;
            if (!start && !end) return false;

            const now = new Date();
            const startDate = start ? new Date(start) : null;
            const endDate = end ? new Date(end) : null;

            if (startDate && endDate) return now >= startDate && now <= endDate;
            if (startDate && !endDate) return now >= startDate;
            if (!startDate && endDate) return now <= endDate;
            return false;
        }

        function formatTopicWindowDate(dtStr) {
            if (!dtStr) return '';
            const d = new Date(dtStr);
            if (isNaN(d.getTime())) return dtStr;
            return d.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function compareProgramCodes(codeARaw, codeBRaw) {
            const codeA = String(codeARaw || '').trim();
            const codeB = String(codeBRaw || '').trim();
            if (!codeA) return 1;
            if (!codeB) return -1;

            const matchA = codeA.match(/^([A-Za-z]+)[-_\s]*(\d+)(.*)$/);
            const matchB = codeB.match(/^([A-Za-z]+)[-_\s]*(\d+)(.*)$/);

            if (matchA && matchB) {
                const prefixA = matchA[1].toUpperCase();
                const prefixB = matchB[1].toUpperCase();
                const catA = prefixA[0];
                const catB = prefixB[0];

                if (catA !== catB) return catA.localeCompare(catB);

                const subA = prefixA.slice(1);
                const subB = prefixB.slice(1);

                if (subA !== subB) {
                    if (subA.startsWith('X') && subB.startsWith('Y')) return -1;
                    if (subA.startsWith('Y') && subB.startsWith('X')) return 1;
                    return subA.localeCompare(subB);
                }

                const numA = parseInt(matchA[2], 10);
                const numB = parseInt(matchB[2], 10);
                if (numA !== numB) return numA - numB;

                return matchA[3].localeCompare(matchB[3]);
            }

            return codeA.localeCompare(codeB, undefined, { numeric: true, sensitivity: 'base' });
        }

        window.fetchTMTopicData = function (section) {
            const team = localStorage.getItem('managerTeam');
            if (typeof db === 'undefined' || !db || !team || !section) return;

            db.collection('config').doc('topicReg').onSnapshot(doc => {
                window.tmtConfig = doc.exists ? doc.data() : null;
                if (window.tmtProgramsList && window.tmtProgramsList.length > 0) window.renderTMTopics();
            });

            db.collection('candidates').where('team', '==', team).where('section', '==', section).get().then(snap => {
                window.tmtCandidates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                return db.collection('programs').where('section', '==', section).where('status', '==', true).where('topicRegistration', '==', true).get();
            }).then(snap => {
                window.tmtProgramsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                window.tmtProgramsList.sort((a, b) => compareProgramCodes(a.code, b.code));

                if (window.tmtProgUnsub) window.tmtProgUnsub();
                window.tmtProgUnsub = db.collection('registrations').where('team', '==', team).where('section', '==', section).onSnapshot(regSnap => {
                    window.tmtRegistrationsList = regSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    window.renderTMTopics();
                });
            });
        }

        window.switchTMTTab = function (progId, slotNum) {
            window.tmtActiveTabs[progId] = slotNum;

            // Hide all tab contents for this prog
            document.querySelectorAll(`.tmt-inputs-${progId}`).forEach(el => el.classList.add('hidden'));
            // Show selected
            const target = document.getElementById(`tmt-inputs-${progId}-${slotNum}`);
            if (target) target.classList.remove('hidden');

            // Update button styles
            document.querySelectorAll(`.tmt-tab-btn-${progId}`).forEach(btn => {
                btn.classList.remove('text-brand-blue', 'border-brand-blue');
                btn.classList.add('text-gray-400', 'border-transparent');
            });
            const activeBtn = document.getElementById(`tmt-tab-btn-${progId}-${slotNum}`);
            if (activeBtn) {
                activeBtn.classList.add('text-brand-blue', 'border-brand-blue');
                activeBtn.classList.remove('text-gray-400', 'border-transparent');
            }
        };

        window.renderTMTopics = function () {
            const bannerContainer = document.getElementById('tmt-status-banner');
            const container = document.getElementById('tmt-list');

            const isUnlocked = checkTopicWindowUnlocked(window.tmtConfig);
            const cfg = window.tmtConfig || {};
            const now = new Date();
            const startDate = cfg.start ? new Date(cfg.start) : null;
            const endDate = cfg.end ? new Date(cfg.end) : null;

            if (bannerContainer) {
                if (isUnlocked) {
                    const timeRangeStr = (cfg.start && cfg.end)
                        ? `${formatTopicWindowDate(cfg.start)} &ndash; ${formatTopicWindowDate(cfg.end)}`
                        : (cfg.end ? `Closes on ${formatTopicWindowDate(cfg.end)}` : `Opened on ${formatTopicWindowDate(cfg.start)}`);

                    bannerContainer.innerHTML = `
                        <div class="mb-5 p-4 rounded-2xl bg-green-50/80 border border-green-200/80 text-green-900 flex items-center justify-between gap-3 shadow-xs">
                            <div class="flex items-center gap-2.5 text-[13px] font-semibold">
                                <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                                <span>Topic Registration Window Open (${timeRangeStr})</span>
                            </div>
                            <span class="text-[10px] font-bold text-green-800 bg-green-100 border border-green-200 px-2.5 py-0.5 rounded-full uppercase tracking-wider">Active</span>
                        </div>
                    `;
                } else {
                    let closedReason = "Topic registration window has not been configured by administration.";
                    if (startDate && now < startDate) {
                        closedReason = `Topic registration will open on <strong>${formatTopicWindowDate(cfg.start)}</strong>.`;
                    } else if (endDate && now > endDate) {
                        closedReason = `Topic registration window closed on <strong>${formatTopicWindowDate(cfg.end)}</strong>.`;
                    }

                    bannerContainer.innerHTML = `
                        <div class="mb-5 p-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-900 flex items-center justify-between gap-3 shadow-xs">
                            <div class="flex items-center gap-2.5 text-[13px]">
                                <i class="fi fi-rr-lock text-amber-600 text-base"></i>
                                <span><strong>Topic Registration Closed:</strong> ${closedReason}</span>
                            </div>
                            <span class="text-[10px] font-bold text-amber-800 bg-amber-100 border border-amber-200 px-2.5 py-0.5 rounded-full uppercase tracking-wider shrink-0">Locked</span>
                        </div>
                    `;
                }
            }

            if (!window.tmtProgramsList || window.tmtProgramsList.length === 0) {
                container.innerHTML = '<div class="col-span-full py-16 text-center text-[13px] text-gray-500 font-medium bg-white rounded-2xl shadow-sm border border-gray-100">No programs in this section require topic registration.</div>';
                return;
            }

            container.innerHTML = window.tmtProgramsList.map(prog => {
                const reg = window.tmtRegistrationsList.find(r => r.programId === prog.id);
                const isGroup = (prog.type || '').toLowerCase().includes('group') || (prog.section || '').toLowerCase() === 'kulliya';

                let totalSlots = 1;
                if (isGroup) {
                    totalSlots = parseInt(prog.groupSetsCount) || 1;
                } else {
                    totalSlots = (prog.maxParticipants && prog.maxParticipants !== 'unlimited') ? (parseInt(prog.maxParticipants) || 1) : 1;
                }
                if (totalSlots < 1) totalSlots = 1;

                const regChests = reg ? (reg.chestNumbers || []) : [];

                if (!window.tmtActiveTabs[prog.id]) {
                    window.tmtActiveTabs[prog.id] = 1;
                }
                const activeSlot = window.tmtActiveTabs[prog.id];

                let tabsHTML = '';
                if (totalSlots > 1) {
                    tabsHTML = `
                        <div class="flex overflow-x-auto no-scrollbar border-b border-gray-100 mb-4 gap-4 scroll-smooth">
                            ${Array.from({ length: totalSlots }, (_, idx) => {
                        const slotNum = idx + 1;
                        const chestNo = regChests[idx] || null;
                        const cand = chestNo ? window.tmtCandidates.find(can => can.chestNo === chestNo) : null;

                        let tabLabel = isGroup ? `Set ${slotNum}` : (chestNo ? `#${chestNo} ${cand ? cand.name.split(' ')[0] : ''}` : `Set ${slotNum}`);
                        const active = activeSlot === slotNum;
                        const activeClass = active ? 'text-brand-blue border-brand-blue' : 'text-gray-400 border-transparent';

                        return `
                                    <button onclick="window.switchTMTTab('${prog.id}', ${slotNum})" id="tmt-tab-btn-${prog.id}-${slotNum}" 
                                        class="tmt-tab-btn-${prog.id} pb-2 text-[10px] font-bold uppercase tracking-wider ${activeClass} border-b-2 transition-all whitespace-nowrap outline-none">
                                        ${tabLabel}
                                    </button>`;
                    }).join('')}
                        </div>
                    `;
                }

                let contentsHTML = '';
                for (let slotNum = 1; slotNum <= totalSlots; slotNum++) {
                    const chestNo = regChests[slotNum - 1] || null;
                    let topicData = {};
                    if (reg && reg.topics) {
                        topicData = (chestNo && reg.topics[chestNo]) || reg.topics[slotNum] || reg.topics['set' + slotNum] || {};
                    }
                    const name = topicData.name || (slotNum === 1 && reg ? reg.topicName : '');
                    const author = topicData.author || (slotNum === 1 && reg ? reg.topicAuthor : '');
                    const content = topicData.content || (slotNum === 1 && reg ? reg.topicContent : '');

                    const isHidden = (totalSlots > 1 && activeSlot !== slotNum) ? 'hidden' : '';

                    contentsHTML += `
                        <div id="tmt-inputs-${prog.id}-${slotNum}" class="tmt-inputs-${prog.id} ${isHidden} space-y-3">
                            ${renderTopicInputs(prog.id, slotNum, name, author, content, !isUnlocked)}
                        </div>`;
                }

                const status = (reg && reg.topicStatus) || 'Not Submitted';
                let statusBadge = '';
                if (status.toLowerCase() === 'approved' || status.toLowerCase() === 'accepted') {
                    statusBadge = `<span class="text-[10px] font-bold text-green-700 bg-green-50 border border-green-200 px-2 py-0.5 rounded-full shadow-sm"><i class="fi fi-rr-check-circle text-[9px] mr-1"></i>Approved</span>`;
                } else if (status.toLowerCase() === 'rejected') {
                    statusBadge = `<span class="text-[10px] font-bold text-red-700 bg-red-50 border border-red-200 px-2 py-0.5 rounded-full shadow-sm"><i class="fi fi-rr-cross-circle text-[9px] mr-1"></i>Rejected</span>`;
                } else if (status.toLowerCase() === 'pending') {
                    statusBadge = `<span class="text-[10px] font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full shadow-sm"><i class="fi fi-rr-clock text-[9px] mr-1"></i>Pending Approval</span>`;
                } else {
                    statusBadge = `<span class="text-[10px] font-bold text-gray-500 bg-gray-50 border border-gray-200 px-2 py-0.5 rounded-full shadow-sm"><i class="fi fi-rr-edit text-[9px] mr-1"></i>Not Submitted</span>`;
                }

                const limitInfo = totalSlots > 1 ? `${totalSlots} Sets / Slots` : '1 Topic Set';

                const btnClass = isUnlocked
                    ? 'bg-gray-50 hover:bg-[#FFB33F] text-gray-800 border border-gray-200 hover:border-transparent cursor-pointer'
                    : 'bg-gray-100 text-gray-400 border border-gray-200 cursor-not-allowed';

                return `
                <div class="bg-white rounded-2xl border border-gray-200 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.02)] p-5 flex flex-col hover:shadow-md transition-shadow">
                    <div class="mb-4">
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <span class="text-[10px] font-bold text-brand-blue bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-full shadow-sm">${prog.code} &bull; ${prog.type}${prog.section ? ' &bull; ' + prog.section : ''}</span>
                            ${statusBadge}
                        </div>
                        <h3 class="text-[15px] font-bold text-gray-900 leading-tight pr-4">${prog.name}</h3>
                        <p class="text-[11px] text-gray-500 mt-1 font-medium">${limitInfo} &bull; ${reg && reg.chestNumbers && reg.chestNumbers.length > 0 ? reg.chestNumbers.length + ' Candidates Registered' : 'No Candidates Registered'}</p>
                    </div>
                    ${tabsHTML}
                    <div class="mt-auto">
                        ${contentsHTML}
                        <button id="tmt-btn-${prog.id}" onclick="window.saveTMTopic('${prog.id}')" ${!isUnlocked ? 'disabled' : ''} class="w-full mt-4 ${btnClass} font-bold text-[12px] py-2.5 rounded-xl transition-all flex items-center justify-center gap-2">
                            <i class="fi fi-${isUnlocked ? 'rr-disk' : 'rr-lock'} text-xs"></i> ${!isUnlocked ? 'Registration Closed' : (reg ? 'Update' : 'Save') + ' Topic Details'}
                        </button>
                    </div>
                </div>`;
            }).join('');
        };

        function renderTopicInputs(progId, slotNum, name, author, content, disabled = false) {
            const disabledAttr = disabled ? 'disabled' : '';
            const inputBg = disabled ? 'bg-gray-50 text-gray-500 cursor-not-allowed' : 'bg-white text-gray-800';

            return `
                <div class="flex flex-col gap-1.5">
                    <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Topic Name</label>
                    <input type="text" id="tmt-name-${progId}-${slotNum}" value="${name || ''}" ${disabledAttr} class="w-full px-3 py-2 border border-gray-200 rounded-lg text-[13px] ${inputBg} focus:outline-none focus:ring-2 focus:ring-brand-blue/20 transition-all shadow-sm" placeholder="${disabled ? 'Registration closed' : 'Enter topic title'}">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Author</label>
                    <input type="text" id="tmt-author-${progId}-${slotNum}" value="${author || ''}" ${disabledAttr} class="w-full px-3 py-2 border border-gray-200 rounded-lg text-[13px] ${inputBg} focus:outline-none focus:ring-2 focus:ring-brand-blue/20 transition-all shadow-sm" placeholder="${disabled ? 'Registration closed' : 'Enter author name'}">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Topic Description</label>
                    <textarea id="tmt-content-${progId}-${slotNum}" rows="3" ${disabledAttr} class="w-full px-3 py-2 border border-gray-200 rounded-lg text-[13px] ${inputBg} focus:outline-none focus:ring-2 focus:ring-brand-blue/20 transition-all shadow-sm" placeholder="${disabled ? 'Registration closed' : 'Enter details...'}">${content || ''}</textarea>
                </div>
            `;
        }

        window.saveTMTopic = function (progId) {
            if (!checkTopicWindowUnlocked(window.tmtConfig)) {
                return typeof showToast === 'function' && showToast("🔒 Topic Registration is currently closed by the admin.");
            }

            const prog = window.tmtProgramsList.find(p => p.id === progId);
            if (!prog) return;

            const team = localStorage.getItem('managerTeam') || '';
            const section = window.currentTMSection || (prog ? prog.section : '') || '';

            const isGroup = (prog.type || '').toLowerCase().includes('group') || (prog.section || '').toLowerCase() === 'kulliya';
            let totalSlots = 1;
            if (isGroup) {
                totalSlots = parseInt(prog.groupSetsCount) || 1;
            } else {
                totalSlots = (prog.maxParticipants && prog.maxParticipants !== 'unlimited') ? (parseInt(prog.maxParticipants) || 1) : 1;
            }
            if (totalSlots < 1) totalSlots = 1;

            const reg = window.tmtRegistrationsList.find(r => r.programId === progId);
            const regChests = reg ? (reg.chestNumbers || []) : [];

            let topics = reg && reg.topics ? { ...reg.topics } : {};
            let firstName = '', firstAuthor = '', firstContent = '';
            let hasAtLeastOne = false;

            for (let slotNum = 1; slotNum <= totalSlots; slotNum++) {
                const chestNo = regChests[slotNum - 1] || null;
                const slotKey = chestNo ? chestNo : slotNum;

                const nameEl = document.getElementById(`tmt-name-${progId}-${slotNum}`);
                const authorEl = document.getElementById(`tmt-author-${progId}-${slotNum}`);
                const contentEl = document.getElementById(`tmt-content-${progId}-${slotNum}`);

                const name = nameEl ? nameEl.value.trim() : '';
                const author = authorEl ? authorEl.value.trim() : '';
                const content = contentEl ? contentEl.value.trim() : '';

                if (name || author || content) {
                    hasAtLeastOne = true;
                }

                const prevStatus = topics[slotKey] && topics[slotKey].status ? topics[slotKey].status : (reg && reg.topicStatus ? reg.topicStatus : 'Pending');
                topics[slotKey] = { name, author, content, status: prevStatus };

                if (slotNum === 1) {
                    firstName = name;
                    firstAuthor = author;
                    firstContent = content;
                }
            }

            if (!hasAtLeastOne) {
                return typeof showToast === 'function' && showToast("❌ Topic Name cannot be empty.");
            }

            let updateData = {
                programId: progId,
                programName: prog.name,
                programCode: prog.code,
                team: team,
                section: section,
                topics: topics,
                topicName: firstName,
                topicAuthor: firstAuthor,
                topicContent: firstContent,
                topicStatus: (reg && reg.topicStatus) || 'Pending',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            const btn = document.getElementById('tmt-btn-' + progId);
            btn.innerHTML = '<div class="w-3 h-3 border-2 border-gray-400 border-t-transparent rounded-full animate-spin"></div>'; btn.disabled = true;

            if (reg) {
                db.collection('registrations').doc(reg.id).update(updateData).then(() => {
                    typeof showToast === 'function' && showToast("✅ Topic Details Saved Successfully!");
                    btn.innerHTML = '<i class="fi fi-rr-disk text-xs"></i> Save Topic Details';
                    btn.disabled = false;
                }).catch(err => {
                    console.error(err);
                    typeof showToast === 'function' && showToast("❌ Error saving topic.");
                    btn.innerHTML = '<i class="fi fi-rr-disk text-xs"></i> Save Topic Details';
                    btn.disabled = false;
                });
            } else {
                updateData.chestNumbers = [];
                updateData.candidateIds = [];
                updateData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                db.collection('registrations').add(updateData).then(() => {
                    typeof showToast === 'function' && showToast("✅ Topic Details Saved Successfully!");
                    btn.innerHTML = '<i class="fi fi-rr-disk text-xs"></i> Save Topic Details';
                    btn.disabled = false;
                }).catch(err => {
                    console.error(err);
                    typeof showToast === 'function' && showToast("❌ Error saving topic.");
                    btn.innerHTML = '<i class="fi fi-rr-disk text-xs"></i> Save Topic Details';
                    btn.disabled = false;
                });
            }
        };
    </script>
</body>

</html>
