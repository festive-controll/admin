<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish / Unpublish Results</title>
    <!-- Favicon / PWA Setup -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="logo-512.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="logo-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            bg: '#f8f9fc',
                            border: '#e5e7eb',
                            textMuted: '#6b7280',
                            textDark: '#111827',
                            blue: '#134E8E',
                            gold: '#FFB33F'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-brand-bg font-sans min-h-screen p-4 sm:p-6 md:p-8">

    <div class="max-w-full w-full mx-auto relative">
        <!-- Header Section -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl sm:text-[22px] font-semibold text-gray-900 leading-tight">Publish Results</h1>
                <p class="text-[12px] sm:text-[13px] text-gray-500 mt-0.5 sm:mt-1">Manage visibility of program results</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative w-full sm:w-64">
                    <i class="fi fi-rr-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="search-input" oninput="renderTable()" placeholder="Search programs..." 
                        class="w-full pl-8 pr-4 py-2 bg-white border border-gray-200 rounded-full text-[13px] focus:outline-none focus:ring-2 focus:ring-[#FFB33F]/30 transition-all">
                </div>
            </div>
        </div>

        <!-- Main Card Area -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] overflow-hidden">
            <!-- Table Header -->
            <div class="overflow-x-auto w-full no-scrollbar">
                <div class="min-w-[800px]">
                    <div class="grid grid-cols-12 gap-4 items-center py-3 px-6 border-b border-gray-100 bg-[#FAFAFA]">
                        <div class="col-span-2 text-[13px] font-medium text-gray-700">Program Code</div>
                        <div class="col-span-4 text-[13px] font-medium text-gray-700">Program Name</div>
                        <div class="col-span-2 text-[13px] font-medium text-gray-700">Section</div>
                        <div class="col-span-2 text-[13px] font-medium text-gray-700">Status</div>
                        <div class="col-span-2 text-[13px] font-medium text-gray-700 text-right">Action</div>
                    </div>
                    <!-- Table Body -->
                    <div id="table-body" class="divide-y divide-gray-50">
                        <div class="py-10 text-center text-gray-400 text-sm">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPrograms = [];
        let allResults = [];
        let programsWithResults = [];
        
        // Use global db if injected into dashboard.html
        if (typeof db === 'undefined') {
            document.getElementById('table-body').innerHTML = '<div class="py-10 text-center text-red-500 text-sm font-medium">Database connection error. Ensure this page is loaded within the admin dashboard.</div>';
        } else {
            initDataListeners();
        }

        function initDataListeners() {
            // Listen to Program Results to know which programs have results
            db.collection('programResults').onSnapshot(snap => {
                allResults = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                processData();
            }, err => console.error("Error fetching results: ", err));

            // Listen to Programs
            db.collection('programs').onSnapshot(snap => {
                allPrograms = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                processData();
            }, err => console.error("Error fetching programs: ", err));
        }

        function processData() {
            if (!allPrograms.length) return;
            
            // Extract unique program IDs that have results
            const programsWithResultIds = new Set(allResults.map(r => r.programId).filter(Boolean));
            
            // Filter programs
            programsWithResults = allPrograms.filter(p => programsWithResultIds.has(p.id));
            
            // Sort alphabetically by program name
            programsWithResults.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            
            renderTable();
        }

        function renderTable() {
            const container = document.getElementById('table-body');
            const searchQ = document.getElementById('search-input').value.toLowerCase().trim();

            let filtered = programsWithResults;
            if (searchQ) {
                filtered = filtered.filter(p => 
                    (p.name || '').toLowerCase().includes(searchQ) || 
                    (p.code || '').toLowerCase().includes(searchQ) ||
                    (p.section || '').toLowerCase().includes(searchQ)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="py-16 text-center">
                        <i class="fi fi-rr-search text-gray-300 text-4xl mb-3 block"></i>
                        <p class="text-[13px] text-gray-400 font-medium">No programs found with entered results.</p>
                    </div>`;
                return;
            }

            let html = '';
            filtered.forEach(prog => {
                const isPublished = prog.resultsPublished === true;
                
                const statusBadge = isPublished 
                    ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-bold bg-green-50 text-green-700 border border-green-100"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Published</span>`
                    : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-bold bg-orange-50 text-orange-700 border border-orange-100"><span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span> Unpublished</span>`;
                
                const actionBtn = isPublished
                    ? `<button onclick="togglePublish('${prog.id}', false)" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-[11px] font-bold text-gray-600 hover:bg-gray-50 flex items-center justify-end gap-2 ml-auto transition-colors"><i class="fi fi-rr-cross-circle text-red-500"></i> Unpublish</button>`
                    : `<button onclick="togglePublish('${prog.id}', true)" class="px-3 py-1.5 bg-[#FFB33F] border border-transparent rounded-lg text-[11px] font-bold text-white shadow-sm hover:bg-opacity-90 flex items-center justify-end gap-2 ml-auto transition-colors"><i class="fi fi-rr-megaphone"></i> Publish</button>`;

                html += `
                    <div class="grid grid-cols-12 gap-4 items-center py-3 px-6 hover:bg-gray-50/50 transition-colors">
                        <div class="col-span-2 text-[13px] font-semibold text-gray-700 uppercase tracking-wider">${prog.code || '-'}</div>
                        <div class="col-span-4 text-[13px] font-medium text-gray-900 truncate pr-4">${prog.name || '-'}</div>
                        <div class="col-span-2 text-[13px] text-gray-600">${prog.section || '-'}</div>
                        <div class="col-span-2">${statusBadge}</div>
                        <div class="col-span-2 text-right">${actionBtn}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function togglePublish(progId, shouldPublish) {
            try {
                await db.collection('programs').doc(progId).update({
                    resultsPublished: shouldPublish
                });
                Toastify({
                    text: shouldPublish ? "✅ Results published!" : "ℹ️ Results unpublished.",
                    duration: 3000,
                    gravity: "top",
                    position: "right",
                    style: { background: shouldPublish ? "#10B981" : "#F59E0B", borderRadius: "8px", fontSize: "13px", fontWeight: "600" }
                }).showToast();
            } catch (err) {
                console.error("Error updating publish status: ", err);
                Toastify({
                    text: "❌ Error updating status.",
                    duration: 3000,
                    gravity: "top",
                    position: "right",
                    style: { background: "#EF4444", borderRadius: "8px", fontSize: "13px", fontWeight: "600" }
                }).showToast();
            }
        }
    </script>
</body>
</html>
