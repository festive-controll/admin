<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish / Unpublish Results</title>
    <!-- Favicon / PWA Setup -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="logo-512.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="logo-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            bg: '#f8f9fc',
                            border: '#e5e7eb',
                            textMuted: '#6b7280',
                            textDark: '#111827',
                            blue: '#134E8E',
                            gold: '#FFB33F'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="module" src="/device-tracker.js"></script>
</head>
<body class="bg-brand-bg font-sans min-h-screen p-4 sm:p-6 md:p-8">

    <div class="max-w-full w-full mx-auto relative">
        <!-- Header Section -->
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-5">
            <div>
                <h1 class="text-xl sm:text-[22px] font-semibold text-gray-900 leading-tight">Publish Results</h1>
                <p class="text-[12px] sm:text-[13px] text-gray-500 mt-0.5 sm:mt-1">Manage visibility of program results</p>
            </div>
            <div class="flex flex-col xs:flex-row sm:flex-row items-stretch sm:items-center gap-3">
                <div class="relative sm:w-44">
                    <select id="category-filter" onchange="renderTable()"
                        class="w-full appearance-none pl-3 pr-9 py-2 bg-white border border-gray-200 rounded-full text-[13px] font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#FFB33F]/30 transition-all cursor-pointer">
                        <option value="all">All programs</option>
                        <option value="sports">Sports</option>
                        <option value="stage">Stage</option>
                        <option value="non-stage">Non-stage</option>
                    </select>
                    <i class="fi fi-rr-angle-small-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                </div>
                <div class="relative w-full sm:w-64">
                    <i class="fi fi-rr-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="search-input" oninput="renderTable()" placeholder="Search programs..." 
                        class="w-full pl-8 pr-4 py-2 bg-white border border-gray-200 rounded-full text-[13px] focus:outline-none focus:ring-2 focus:ring-[#FFB33F]/30 transition-all">
                </div>
            </div>
        </div>

        <!-- Result counts for the selected program category -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5" aria-live="polite">
            <div class="bg-white border border-gray-200 rounded-xl px-4 py-3 flex items-center justify-between shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)]">
                <div class="flex items-center gap-3">
                    <span class="w-9 h-9 rounded-lg bg-blue-50 text-[#134E8E] flex items-center justify-center"><i class="fi fi-rr-cloud-upload-alt"></i></span>
                    <div><p class="text-[11px] font-semibold uppercase tracking-wider text-gray-400">Uploaded results</p><p id="uploaded-count-label" class="text-[12px] text-gray-500 mt-0.5">All programs</p></div>
                </div>
                <span id="uploaded-count" class="text-2xl font-bold text-gray-900">0</span>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl px-4 py-3 flex items-center justify-between shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)]">
                <div class="flex items-center gap-3">
                    <span class="w-9 h-9 rounded-lg bg-green-50 text-green-600 flex items-center justify-center"><i class="fi fi-rr-check-circle"></i></span>
                    <div><p class="text-[11px] font-semibold uppercase tracking-wider text-gray-400">Published results</p><p id="published-count-label" class="text-[12px] text-gray-500 mt-0.5">All programs</p></div>
                </div>
                <span id="published-count" class="text-2xl font-bold text-green-600">0</span>
            </div>
        </div>

        <!-- Main Card Area -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] overflow-hidden">
            <!-- Table Header -->
            <div class="overflow-x-auto w-full no-scrollbar">
                <div class="min-w-[800px]">
                    <div class="grid grid-cols-12 gap-4 items-center py-3 px-6 border-b border-gray-100 bg-[#FAFAFA]">
                        <div class="col-span-2 text-[13px] font-medium text-gray-700">Program Code</div>
                        <div class="col-span-4 text-[13px] font-medium text-gray-700">Program Name</div>
                        <div class="col-span-2 text-[13px] font-medium text-gray-700">Section</div>
                        <div class="col-span-2 text-[13px] font-medium text-gray-700">Status</div>
                        <div class="col-span-2 text-[13px] font-medium text-gray-700 text-right">Action</div>
                    </div>
                    <!-- Table Body -->
                    <div id="table-body" class="divide-y divide-gray-50">
                        <div class="py-10 text-center text-gray-400 text-sm">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPrograms = [];
        let allResults = [];
        let programsWithResults = [];
        
        // Use global db if injected into dashboard.html
        if (typeof db === 'undefined') {
            document.getElementById('table-body').innerHTML = '<div class="py-10 text-center text-red-500 text-sm font-medium">Database connection error. Ensure this page is loaded within the admin dashboard.</div>';
        } else {
            initDataListeners();
        }

        function initDataListeners() {
            if (typeof window.cheskPublishUnsub === 'function') window.cheskPublishUnsub();
            var activeUnsubs = [];
            // Listen to Program Results to know which programs have results
            activeUnsubs.push(db.collection('programResults').onSnapshot(snap => {
                if (!document.getElementById('table-body')) return;
                allResults = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                processData();
            }, err => console.error("Error fetching results: ", err)));

            // Listen to Programs
            activeUnsubs.push(db.collection('programs').onSnapshot(snap => {
                if (!document.getElementById('table-body')) return;
                allPrograms = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                processData();
            }, err => console.error("Error fetching programs: ", err)));
            window.cheskPublishUnsub = function () {
                activeUnsubs.forEach(function (unsubscribe) { unsubscribe(); });
                activeUnsubs = [];
            };
        }

        function processData() {
            if (!allPrograms.length) return;
            
            // Extract unique program IDs that have results
            const programsWithResultIds = new Set(allResults.map(r => r.programId).filter(Boolean));
            
            // Filter programs
            programsWithResults = allPrograms.filter(p => programsWithResultIds.has(p.id));
            
            // Sort alphabetically by program name
            programsWithResults.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            
            renderTable();
        }

        function resolveProgramCategory(prog) {
            const rawType = [prog.venueTypeName, prog.venueType, prog.venue_type, prog.category]
                .find(value => typeof value === 'string' && value.trim());
            const normalized = String(rawType || '').toLowerCase().replace(/[\s_-]+/g, '');
            if (normalized.includes('sport')) return 'sports';
            if (normalized.includes('nonstage')) return 'non-stage';
            if (normalized === 'stage' || normalized.endsWith('stage')) return 'stage';

            // Legacy program codes use X for non-stage and Y for stage.
            const code = String(prog.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (/^[A-Z]*X\d+/.test(code)) return 'non-stage';
            if (/^[A-Z]*Y\d+/.test(code)) return 'stage';
            return '';
        }

        function updateCountBar(categoryPrograms, selectedCategory) {
            const uploadedCount = document.getElementById('uploaded-count');
            const publishedCount = document.getElementById('published-count');
            const uploadedLabel = document.getElementById('uploaded-count-label');
            const publishedLabel = document.getElementById('published-count-label');
            const categoryFilter = document.getElementById('category-filter');
            if (!uploadedCount || !publishedCount || !uploadedLabel || !publishedLabel) return;

            const label = categoryFilter && categoryFilter.selectedOptions.length
                ? categoryFilter.selectedOptions[0].text
                : (selectedCategory === 'all' ? 'All programs' : selectedCategory);
            uploadedCount.textContent = categoryPrograms.length;
            publishedCount.textContent = categoryPrograms.filter(p => p.resultsPublished === true).length;
            uploadedLabel.textContent = label;
            publishedLabel.textContent = label;
        }

        function renderTable() {
            const container = document.getElementById('table-body');
            const searchInput = document.getElementById('search-input');
            const categoryFilter = document.getElementById('category-filter');
            if (!container || !searchInput || !categoryFilter) return;
            const searchQ = searchInput.value.toLowerCase().trim();
            const selectedCategory = categoryFilter.value;

            let filtered = programsWithResults;
            if (selectedCategory !== 'all') {
                filtered = filtered.filter(p => resolveProgramCategory(p) === selectedCategory);
            }
            updateCountBar(filtered, selectedCategory);

            if (searchQ) {
                filtered = filtered.filter(p => 
                    (p.name || '').toLowerCase().includes(searchQ) || 
                    (p.code || '').toLowerCase().includes(searchQ) ||
                    (p.section || '').toLowerCase().includes(searchQ)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="py-16 text-center">
                        <i class="fi fi-rr-search text-gray-300 text-4xl mb-3 block"></i>
                        <p class="text-[13px] text-gray-400 font-medium">No programs found with entered results.</p>
                    </div>`;
                return;
            }

            let html = '';
            filtered.forEach(prog => {
                const isPublished = prog.resultsPublished === true;
                
                const statusBadge = isPublished 
                    ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-bold bg-green-50 text-green-700 border border-green-100"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Published</span>`
                    : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-bold bg-orange-50 text-orange-700 border border-orange-100"><span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span> Unpublished</span>`;
                
                const isPrinted = isPublished && !!prog.resultPdfSavedAt;
                const actionBtn = isPrinted
                    ? `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-50 border border-blue-100 rounded-lg text-[11px] font-bold text-[#134E8E]"><i class="fi fi-rr-print"></i> Printed</span>`
                    : isPublished
                    ? `<button onclick="togglePublish('${prog.id}', false)" class="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-[11px] font-bold text-gray-600 hover:bg-gray-50 flex items-center justify-end gap-2 ml-auto transition-colors"><i class="fi fi-rr-cross-circle text-red-500"></i> Unpublish</button>`
                    : `<button onclick="togglePublish('${prog.id}', true)" class="px-3 py-1.5 bg-[#FFB33F] border border-transparent rounded-lg text-[11px] font-bold text-white shadow-sm hover:bg-opacity-90 flex items-center justify-end gap-2 ml-auto transition-colors"><i class="fi fi-rr-megaphone"></i> Publish</button>`;

                html += `
                    <div class="grid grid-cols-12 gap-4 items-center py-3 px-6 hover:bg-gray-50/50 transition-colors">
                        <div class="col-span-2 text-[13px] font-semibold text-gray-700 uppercase tracking-wider">${prog.code || '-'}</div>
                        <div class="col-span-4 text-[13px] font-medium text-gray-900 truncate pr-4">${prog.name || '-'}</div>
                        <div class="col-span-2 text-[13px] text-gray-600">${prog.section || '-'}</div>
                        <div class="col-span-2">${statusBadge}</div>
                        <div class="col-span-2 text-right">${actionBtn}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function togglePublish(progId, shouldPublish) {
            try {
                const publishUpdate = { resultsPublished: shouldPublish };
                if (shouldPublish) {
                    // A newly published result is not "Printed" until saved from pblish.html.
                    publishUpdate.resultPdfSavedAt = null;
                    publishUpdate.resultPublishedDate = null;
                }
                await db.collection('programs').doc(progId).update(publishUpdate);

                // Open the publication sheet for the program that was just published.
                if (shouldPublish) {
                    sessionStorage.setItem('publishProgramId', progId);
                    if (typeof loadModule === 'function') {
                        loadModule('pblish');
                    } else {
                        window.location.href = `pblish.html?programId=${encodeURIComponent(progId)}`;
                    }
                    return;
                }
                Toastify({
                    text: "Results unpublished.",
                    duration: 3000,
                    gravity: "top",
                    position: "right",
                    style: { background: shouldPublish ? "#10B981" : "#F59E0B", borderRadius: "8px", fontSize: "13px", fontWeight: "600" }
                }).showToast();
            } catch (err) {
                console.error("Error updating publish status: ", err);
                Toastify({
                    text: "Error updating status.",
                    duration: 3000,
                    gravity: "top",
                    position: "right",
                    style: { background: "#EF4444", borderRadius: "8px", fontSize: "13px", fontWeight: "600" }
                }).showToast();
            }
        }
    </script>
</body>
</html>
