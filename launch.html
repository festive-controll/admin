  <!-- THREE.JS & GSAP CARD EXIT & ENTER ANIMATION SEQUENCER -->
  <script>
    let scene, camera, renderer;
    let particleSystem, particleGeometry;
    let particleCount = 2000;
    let particlePositions, particleVelocities;
    let isOpeningCompleted = false;
    let isLaunching = false;

    function init3D() {
      const container = document.getElementById('webgl-canvas');
      
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x060911, 0.0012);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.z = 400;

      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const canvas = document.createElement('canvas');
      canvas.width = 32; canvas.height = 32;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.8)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 32);

      const pTexture = new THREE.CanvasTexture(canvas);

      particleGeometry = new THREE.BufferGeometry();
      particlePositions = new Float32Array(particleCount * 3);
      particleVelocities = new Float32Array(particleCount * 3);
      const particleColors = new Float32Array(particleCount * 3);

      const colorPalette = [new THREE.Color(0x17635F), new THREE.Color(0xC0912B), new THREE.Color(0x92205D), new THREE.Color(0x37314F)];

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const radius = Math.random() * 600 + 40;
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - 0.5) * Math.PI;

        particlePositions[i3] = radius * Math.cos(theta) * Math.cos(phi);
        particlePositions[i3 + 1] = radius * Math.sin(phi);
        particlePositions[i3 + 2] = (Math.random() - 0.5) * 1200;

        particleVelocities[i3 + 2] = Math.random() * 0.8 + 0.2;

        const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
        particleColors[i3] = color.r;
        particleColors[i3 + 1] = color.g;
        particleColors[i3 + 2] = color.b;
      }

      particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
      particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

      const particleMat = new THREE.PointsMaterial({
        size: 3.5,
        vertexColors: true,
        map: pTexture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particleSystem = new THREE.Points(particleGeometry, particleMat);
      scene.add(particleSystem);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);

      const pos = particleSystem.geometry.attributes.position.array;
      const speedMult = isLaunching ? 8.0 : 1.0;

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        pos[i3 + 2] += particleVelocities[i3 + 2] * speedMult;
        if (pos[i3 + 2] > 500) {
          pos[i3 + 2] = -700;
          pos[i3] = (Math.random() - 0.5) * 1000;
          pos[i3 + 1] = (Math.random() - 0.5) * 800;
        }
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
      particleSystem.rotation.z += 0.0005 * speedMult;

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function triggerParticleBurst() {
      const positions = particleSystem.geometry.attributes.position.array;
      for (let i = 0; i < 200; i++) {
        const idx = Math.floor(Math.random() * particleCount) * 3;
        positions[idx] += (Math.random() - 0.5) * 60;
        positions[idx + 1] += (Math.random() - 0.5) * 60;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
    }


    // Preloader
    let progressVal = 0;
    const statusMessages = [
      { pct: 25, msg: "LOADING FESTIVAL ASSETS..." },
      { pct: 60, msg: "VERIFYING SYSTEM DATA..." },
      { pct: 90, msg: "PORTAL READY..." },
      { pct: 100, msg: "READY! PRESS BUTTON TO OPEN" }
    ];

    function runOpeningSequence() {
      const progressBar = document.getElementById('opening-progress-bar');
      const percentText = document.getElementById('opening-percent');
      const statusText = document.getElementById('opening-status');

      const interval = setInterval(() => {
        if (isOpeningCompleted) {
          clearInterval(interval);
          return;
        }

        progressVal += Math.floor(Math.random() * 6) + 4;

        if (progressVal >= 100) {
          progressVal = 100;
          clearInterval(interval);
          if (progressBar) progressBar.style.width = '100%';
          if (percentText) percentText.innerText = '100%';
          if (statusText) {
            statusText.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> READY! PRESS BUTTON TO OPEN`;
          }
        } else {
          if (progressBar) progressBar.style.width = progressVal + '%';
          if (percentText) percentText.innerText = progressVal + '%';
          
          const msgObj = statusMessages.find(m => progressVal <= m.pct);
          if (msgObj && statusText) {
            statusText.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-teal-400 animate-ping"></span> ${msgObj.msg}`;
          }
        }
      }, 80);
    }


    // ==========================================
    // DYNAMIC 4s ANIMATION: HERO CARD EXIT -> PORTAL REVEAL CARD ENTERS -> WEBSITE OPENS
    // ==========================================
    function executeWebsiteOpening() {
      if (isOpeningCompleted) return;
      isOpeningCompleted = true;
      isLaunching = true;

      const heroCard = document.getElementById('hero-card');
      const portalRevealCard = document.getElementById('portal-reveal-card');
      const warpOverlay = document.getElementById('warp-overlay');
      const countdownNum = document.getElementById('countdown-num');

      playLaunchSynthSound();

      // Show reveal card element
      portalRevealCard.classList.remove('hidden');

      let secondsLeft = 4;
      const cdInterval = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft > 0 && countdownNum) {
          countdownNum.innerText = secondsLeft;
        } else {
          clearInterval(cdInterval);
        }
      }, 1000);

      // GSAP 4-Second Animation Timeline
      gsap.timeline()
        // 1. Initial Hero Card vanishes with 3D flip & scale down
        .to(heroCard, {
          duration: 0.8,
          scale: 0.2,
          opacity: 0,
          rotateY: 180,
          ease: "back.in(1.7)"
        })
        // 2. Portal Reveal Card emerges in its place
        .fromTo(portalRevealCard, 
          { scale: 0.2, opacity: 0, rotateY: -180 },
          { duration: 1.0, scale: 1, opacity: 1, rotateY: 0, ease: "back.out(1.7)" },
          "-=0.2"
        )
        // 3. Final Flash Curtain opens website at 4.0s mark
        .to(warpOverlay, {
          duration: 0.6,
          opacity: 1,
          ease: "power2.in",
          onComplete: () => {
            window.location.href = "public/index.html";
          }
        }, "+=1.6");
    }


    // Web Audio Synthesizer
    let audioCtx = null;
    let ambientOsc = null;
    let isAudioPlaying = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleAudioSynth() {
      initAudio();
      const btnText = document.getElementById('audio-label');
      const btnIcon = document.getElementById('audio-icon');

      if (isAudioPlaying) {
        if (ambientOsc) ambientOsc.stop();
        isAudioPlaying = false;
        btnText.innerText = "SOUND: OFF";
        btnIcon.setAttribute('data-icon', 'lucide:volume-x');
      } else {
        ambientOsc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        ambientOsc.type = 'sine';
        ambientOsc.frequency.setValueAtTime(110, audioCtx.currentTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(400, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);

        ambientOsc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        ambientOsc.start();
        isAudioPlaying = true;
        btnText.innerText = "SOUND: ON";
        btnIcon.setAttribute('data-icon', 'lucide:volume-2');
      }
    }

    function playLaunchSynthSound() {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 3.8);

        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4.0);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 4.0);
      } catch(e) {}
    }

    window.addEventListener('load', () => {
      init3D();
      runOpeningSequence();
    });
  </script>
