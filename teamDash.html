<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Dashboard Module</title>
    <!-- Favicon / PWA Setup -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="logo-512.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="logo-192.png">
</head>
<body>
    <div class="mb-6 shrink-0 pt-2">
        <h1 id="tm-section-title" class="text-xl sm:text-[22px] font-semibold text-gray-900 leading-tight">Candidates</h1>
        <p class="text-[13px] text-gray-500 mt-1">Candidates actively registered to your team</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col overflow-hidden flex-1 min-h-[400px]">
        <div class="p-4 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4 bg-gray-50/50 shrink-0">
            <div class="relative w-full sm:w-80">
                <i class="fi fi-rr-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-[13px]"></i>
                <input type="text" id="tm-search-input" oninput="window.renderTMCandidates()" placeholder="Search name..." 
                    class="w-full pl-9 pr-4 py-2 bg-white border border-gray-200 rounded-lg text-[13px] focus:outline-none focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue transition-all">
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="flex items-center gap-2 w-full sm:w-auto bg-white border border-gray-200 rounded-lg px-3 py-1 shadow-sm">
                    <i class="fi fi-rr-filter text-xs text-gray-400"></i>
                    <select id="tm-filter-class" onchange="window.renderTMCandidates()" class="w-full bg-transparent text-[13px] text-gray-700 focus:outline-none py-1.5 appearance-none cursor-pointer pr-4 font-medium">
                        <option value="">All Classes</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="overflow-auto w-full flex-1 relative custom-scrollbar">
            <div class="w-full min-w-[700px]">
                <div class="grid grid-cols-12 gap-4 items-center py-3 px-6 border-b border-gray-100 bg-[#FAFAFA] sticky top-0 z-10 shadow-sm">
                    <div class="col-span-8 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Candidate Name</div>
                    <div class="col-span-2 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Chest No</div>
                    <div class="col-span-2 text-[11px] font-bold text-gray-400 uppercase tracking-wider">Class</div>
                </div>
                <div id="tm-candidates-tbody">
                    <div class="px-6 py-12 text-center text-sm text-gray-400"><div class="w-6 h-6 border-2 border-gray-200 border-t-brand-blue rounded-full animate-spin mx-auto mb-2"></div>Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('tm-section-title').innerText = (window.currentTMSection || 'Section') + ' Candidates';
        var tmTeam = localStorage.getItem('managerTeam');
        var sectionName = window.currentTMSection;

        if (window.tmCandUnsub) window.tmCandUnsub();
        
        if (typeof db !== 'undefined' && sectionName && tmTeam) {
            // Fetch Team color for UI rendering
            window.tmTeamColor = '#134E8E'; // Default brand color
            db.collection('teams').where('name', '==', tmTeam).limit(1).get().then(snap => {
                if (!snap.empty) {
                    window.tmTeamColor = snap.docs[0].data().color || '#134E8E';
                    if (window.tmCandidatesData) window.renderTMCandidates();
                }
            });

            window.tmCandUnsub = db.collection('candidates')
                .where('team', '==', tmTeam)
                .onSnapshot(snap => {
                    window.tmCandidatesData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(c => c.section === sectionName);
                    
                    const classSelect = document.getElementById('tm-filter-class');
                    if (classSelect) {
                        const currentVal = classSelect.value;
                        const uniqueClasses = [...new Set(window.tmCandidatesData.map(c => c.class).filter(c => typeof c === 'string' && c.trim() !== ''))].sort();
                        classSelect.innerHTML = '<option value="">All Classes</option>' + uniqueClasses.map(cls => `<option value="${cls}">${cls}</option>`).join('');
                        if (uniqueClasses.includes(currentVal)) classSelect.value = currentVal;
                    }
                    window.renderTMCandidates();
                }, err => {
                    console.error("Firestore Error:", err);
                    const tbody = document.getElementById('tm-candidates-tbody');
                    if (tbody) tbody.innerHTML = `<div class="px-6 py-12 text-center text-[13px] text-red-500 font-medium">Database connection error. Check console.</div>`;
                });
        }

        window.renderTMCandidates = function() {
            const tbody = document.getElementById('tm-candidates-tbody');
            if (!tbody) return;
            
            const searchQ = (document.getElementById('tm-search-input')?.value || '').toLowerCase().trim();
            const classQ = document.getElementById('tm-filter-class')?.value || '';
            
            let filtered = window.tmCandidatesData || [];
            
            if (searchQ) {
                filtered = filtered.filter(c => 
                    (c.name && c.name.toLowerCase().includes(searchQ))
                );
            }
            
            if (classQ) {
                filtered = filtered.filter(c => c.class === classQ);
            }
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<div class="px-6 py-16 text-center text-[13px] text-gray-500 font-medium bg-gray-50/30">No candidates match your search or filter criteria.</div>';
                return;
            }
            
            const tColor = window.tmTeamColor || '#134E8E';
            
            tbody.innerHTML = filtered.map(c => `
                <div class="grid grid-cols-12 gap-4 items-center py-2.5 px-6 border-b border-gray-100 bg-white hover:bg-gray-50 transition-colors group">
                    <div class="col-span-8 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-[13px] shadow-sm border shrink-0 uppercase" style="background-color: ${tColor}15; color: ${tColor}; border-color: ${tColor}30;">
                            ${(c.name || '?').charAt(0)}
                        </div>
                        <span onclick="window.openTMRegisteredProgramsModal('${c.id}')" class="text-[13.5px] font-medium text-gray-900 hover:text-brand-blue hover:underline cursor-pointer transition-colors">${c.name || '—'}</span>
                    </div>
                    <div class="col-span-2"><span class="text-[13px] font-medium text-gray-700">${c.chestNo || 'N/A'}</span></div>
                    <div class="col-span-2"><span class="px-2.5 py-1 bg-gray-100 text-gray-600 rounded-md text-[11px] font-medium border border-gray-200">${c.class || 'N/A'}</span></div>
                </div>
            `).join('');
        };

        window.viewCandidateProfile = function(id, name) {
            window.openTMRegisteredProgramsModal(id);
        };

        window.openTMRegisteredProgramsModal = function(candId) {
            let cand = null;
            if (window.tmCandidatesData) {
                cand = window.tmCandidatesData.find(c => c.id === candId);
            }
            if (!cand && typeof candidatesData !== 'undefined' && Array.isArray(candidatesData)) {
                cand = candidatesData.find(c => c.id === candId);
            }
            if (!cand) return;

            let modal = document.getElementById('tm-cand-prog-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'tm-cand-prog-modal';
                modal.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[200] flex items-center justify-center p-4 sm:p-6 transition-all hidden';
                modal.innerHTML = `
                    <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl border border-gray-100 overflow-hidden flex flex-col max-h-[85vh] animate-in fade-in zoom-in duration-200">
                        <div class="px-6 py-5 border-b border-gray-100 bg-gray-50/70 flex items-center justify-between">
                            <div class="flex items-center gap-3.5">
                                <div class="w-10 h-10 rounded-2xl bg-blue-50 text-brand-blue font-bold text-sm flex items-center justify-center border border-blue-100 shadow-sm shrink-0" id="tm-modal-chest-badge">
                                    #--
                                </div>
                                <div>
                                    <h3 class="text-[16px] font-bold text-gray-900 leading-tight" id="tm-modal-cand-name">Candidate Name</h3>
                                    <p class="text-[12px] text-gray-500 mt-0.5" id="tm-modal-cand-sub">Team • Section • Class</p>
                                </div>
                            </div>
                            <button onclick="window.closeTMRegisteredProgramsModal()" class="w-9 h-9 rounded-full bg-white border border-gray-200 hover:bg-gray-100 text-gray-500 hover:text-gray-900 flex items-center justify-center transition-all shadow-sm">
                                <i class="fi fi-rr-cross text-xs"></i>
                            </button>
                        </div>
                        <div class="p-6 overflow-y-auto flex-1 custom-scrollbar" id="tm-modal-body">
                            <div class="flex justify-center items-center py-12 flex-col gap-2">
                                <div class="w-7 h-7 border-2 border-gray-200 border-t-brand-blue rounded-full animate-spin"></div>
                                <span class="text-[13px] text-gray-400 font-medium">Loading registered programs...</span>
                            </div>
                        </div>
                        <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex items-center justify-between">
                            <span class="text-[12px] font-semibold text-gray-500 bg-white border border-gray-200 px-3 py-1 rounded-full shadow-xs" id="tm-modal-prog-count">0 Programs</span>
                            <button onclick="window.closeTMRegisteredProgramsModal()" class="px-5 py-2 bg-gray-900 hover:bg-gray-800 text-white font-bold text-[13px] rounded-xl shadow-sm transition-all active:scale-95">
                                Close
                            </button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                modal.addEventListener('click', function(e) {
                    if (e.target === modal) window.closeTMRegisteredProgramsModal();
                });
            }

            const chestBadge = document.getElementById('tm-modal-chest-badge');
            const nameEl = document.getElementById('tm-modal-cand-name');
            const subEl = document.getElementById('tm-modal-cand-sub');
            const bodyEl = document.getElementById('tm-modal-body');
            const countEl = document.getElementById('tm-modal-prog-count');

            if (chestBadge) chestBadge.innerText = cand.chestNo ? '#' + cand.chestNo : '#--';
            if (nameEl) nameEl.innerText = cand.name || 'Candidate';
            if (subEl) subEl.innerText = `${cand.team || 'Team'} • ${cand.section || 'Section'} ${cand.class ? '• Class ' + cand.class : ''}`;

            if (bodyEl) {
                bodyEl.innerHTML = `
                    <div class="flex justify-center items-center py-12 flex-col gap-2">
                        <div class="w-7 h-7 border-2 border-gray-200 border-t-brand-blue rounded-full animate-spin"></div>
                        <span class="text-[13px] text-gray-400 font-medium">Loading registered programs...</span>
                    </div>
                `;
            }
            if (countEl) countEl.innerText = 'Loading...';

            modal.classList.remove('hidden');

            const dbRef = window.db || (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore());
            if (!dbRef) {
                if (bodyEl) bodyEl.innerHTML = `<div class="py-10 text-center text-red-500 font-medium text-xs">Database not connected</div>`;
                return;
            }

            const candIdStr = String(cand.id);
            const chestNoStr = cand.chestNo ? String(cand.chestNo) : '';

            Promise.all([
                dbRef.collection('registrations').get(),
                dbRef.collection('programs').get()
            ]).then(([regSnap, progSnap]) => {
                const progsMap = {};
                progSnap.docs.forEach(d => {
                    progsMap[d.id] = { id: d.id, ...d.data() };
                });

                const matchedRegs = [];
                regSnap.docs.forEach(d => {
                    const r = { id: d.id, ...d.data() };
                    const candIds = Array.isArray(r.candidateIds) ? r.candidateIds.map(String) : (r.candidateId ? [String(r.candidateId)] : []);
                    const chests = Array.isArray(r.chestNumbers) ? r.chestNumbers.map(String) : [];
                    
                    const matchId = candIds.includes(candIdStr);
                    const matchChest = chestNoStr && chests.includes(chestNoStr) && (!r.team || r.team === cand.team);

                    if (matchId || matchChest) {
                        matchedRegs.push(r);
                    }
                });

                const uniqueProgs = [];
                const seenProgKeys = new Set();

                matchedRegs.forEach(r => {
                    const pId = r.programId || r.progId;
                    const prog = (pId && progsMap[pId]) ? progsMap[pId] : {};
                    const code = r.programCode || r.code || prog.code || 'PRG';
                    const name = r.programName || r.name || prog.name || 'Untitled Program';
                    const section = r.section || prog.section || cand.section || '-';
                    const type = r.type || prog.type || 'Individual';
                    
                    const key = (code + '_' + name).toLowerCase();
                    if (!seenProgKeys.has(key)) {
                        seenProgKeys.add(key);
                        uniqueProgs.push({ code, name, section, type });
                    }
                });

                function compareProgramCodes(codeARaw, codeBRaw) {
                    const codeA = String(codeARaw || '').trim();
                    const codeB = String(codeBRaw || '').trim();
                    if (!codeA) return 1;
                    if (!codeB) return -1;

                    const matchA = codeA.match(/^([A-Za-z]+)[-_\s]*(\d+)(.*)$/);
                    const matchB = codeB.match(/^([A-Za-z]+)[-_\s]*(\d+)(.*)$/);

                    if (matchA && matchB) {
                        const prefixA = matchA[1].toUpperCase();
                        const prefixB = matchB[1].toUpperCase();
                        const catA = prefixA[0];
                        const catB = prefixB[0];

                        if (catA !== catB) return catA.localeCompare(catB);

                        const subA = prefixA.slice(1);
                        const subB = prefixB.slice(1);

                        if (subA !== subB) {
                            if (subA.startsWith('X') && subB.startsWith('Y')) return -1;
                            if (subA.startsWith('Y') && subB.startsWith('X')) return 1;
                            return subA.localeCompare(subB);
                        }

                        const numA = parseInt(matchA[2], 10);
                        const numB = parseInt(matchB[2], 10);
                        if (numA !== numB) return numA - numB;

                        return matchA[3].localeCompare(matchB[3]);
                    }

                    return codeA.localeCompare(codeB, undefined, { numeric: true, sensitivity: 'base' });
                }

                uniqueProgs.sort((a, b) => compareProgramCodes(a.code, b.code));

                if (countEl) countEl.innerText = `${uniqueProgs.length} Program${uniqueProgs.length !== 1 ? 's' : ''}`;

                if (uniqueProgs.length === 0) {
                    if (bodyEl) {
                        bodyEl.innerHTML = `
                            <div class="py-12 text-center text-gray-400 flex flex-col items-center">
                                <i class="fi fi-rr-box-open text-4xl mb-2 text-gray-300"></i>
                                <p class="text-[13.5px] font-semibold text-gray-700">No Registered Programs</p>
                                <p class="text-[12px] text-gray-400 mt-1">This candidate is not currently registered for any programs.</p>
                            </div>
                        `;
                    }
                } else {
                    if (bodyEl) {
                        bodyEl.innerHTML = `
                            <div class="space-y-3">
                                ${uniqueProgs.map(p => `
                                    <div class="bg-gray-50/70 border border-gray-200/80 rounded-2xl p-4 flex items-center justify-between shadow-2xs hover:bg-white hover:border-blue-200 hover:shadow-sm transition-all group">
                                        <div class="flex items-center gap-3">
                                            <div class="px-2.5 py-1 rounded-xl bg-blue-50 border border-blue-100 text-brand-blue font-bold font-mono-custom text-xs shadow-2xs shrink-0">
                                                ${p.code}
                                            </div>
                                            <div>
                                                <h4 class="text-[14px] font-bold text-gray-900 group-hover:text-brand-blue transition-colors leading-tight">${p.name}</h4>
                                                <div class="flex items-center gap-2 mt-1">
                                                    <span class="text-[11px] text-gray-500 font-medium">${p.section}</span>
                                                    <span class="text-gray-300">•</span>
                                                    <span class="text-[10px] text-gray-600 font-bold bg-white border border-gray-200 px-2 py-0.5 rounded-full uppercase tracking-wider">${p.type}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <span class="px-3 py-1 bg-green-50 text-green-700 border border-green-200 text-[10px] font-bold rounded-full uppercase tracking-wider shrink-0">
                                            Registered
                                        </span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }
                }
            }).catch(err => {
                console.error("Error fetching candidate registered programs:", err);
                if (bodyEl) bodyEl.innerHTML = `<div class="py-10 text-center text-red-500 font-medium text-xs">Failed to load registered programs.</div>`;
            });
        };

        window.closeTMRegisteredProgramsModal = function() {
            const modal = document.getElementById('tm-cand-prog-modal');
            if (modal) modal.classList.add('hidden');
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') window.closeTMRegisteredProgramsModal();
        });
    </script>
</body>
</html>
